body:
  text: 元豐九域志卷三宋王存等撰陜西路永興軍路秦鳯路陜西路太平興國二年分河北河南路又有陜府西路後併一路熈寧五年分永興軍秦鳯二路永興軍路府二州一十五軍一縣八十三次府京兆府京兆郡永興軍節度治長安萬年二縣地里東京二千二百五十里東至本府界九十五里自界首至華州八十五里西至本府界一百六十一里自界首至鳯翔府一百四十八里南至本府界四百三十里自界首至金州一百五十里北至本府界八十三里自界首至耀州九十七里東南至本府界一百三十里自界首至商州一百三十五里西南至本府界一百四十五里自界首至洋州九十五里東北至本府界一百三十里自界首至同州一百二十里西北至本府界一百七十五里自界首至邠州一百里戸主一十五萬八千七十二客六萬五千二百四十土貢席一十領鞾氊一十領蠟五十斤酸棗仁二斗地骨皮一十斤縣一十四乾德二年以奉先縣𨽻同州好畤縣𨽻乾州大中祥符八年改昭應縣為臨潼熈寧五年乾州廢以奉天縣𨽻州次赤長安六鄉子午一鎮有終南山龍首山灃水渭水鎬水漆渠次赤萬年七鄉城東城南鳴特異谷伯橋五鎮有終南山滻水龍首渠次畿鄠府南六十里三鄉秦渡日河二鎮有終南山渭水渼陂次畿藍田府東南七十里二鄉焦戴堠子二鎮有藍田山蕢水灞水次畿咸陽府西四十里二鄉有渭水灃水次畿醴泉府西北七十里四鄉甘北一鎮有九嵕山浪水次畿涇陽府北七十里三鄉臨涇一鎮有涇水白渠龍泉陂次畿櫟陽府東北九十里二鄉粟邑一鎮有渭水沮河淸泉陂次畿高陵府東北七十里一鄉畹沙渭橋二鎮有涇水渭水白渠次畿興平府西八十五里二鄉有渭水灃水次畿乾祐府東南三百五十里四鄉有泎水洵水次畿奉天府西北一百五十里三鄉薛禄一鎮有梁山漢水監二熈寧四年置鑄銅錢八年置鑄鐵錢銅錢府西北一里鐵錢府西北一里古跡杜城即杜伯國也鄠夏之有扈國也書云啟與有扈戰於甘亭崇國今為鄠縣也武功古有邰國古有聚城新豐古城古酈戎國秦曰驪邑酈戎故城亦驪戎國也軹道秦王子嬰於此降高帝子午關王莽通子午道因置關今廢終南山毛萇云周之名山終南也九嵕山子午谷渭水灞水滻水焦䕶澤爾雅云周有焦䕶樊川十道志云其地即杜陵之鄉漢將軍樊噲食邑於此故曰樊川龍首渠氷池按十道志名彪池亦名聖女泉蚩尤冢扁鵲墓荆軻冢樗里子墓太公冢蝦蟇陵董仲舒墓也揚雄冢次府河中府河東郡䕶國軍節度唐河中節度皇朝太平興國七年改䕶國軍治河東縣地里東京九百三十二里東至本府界七十五里自界首至解州二十九里西至本府界一十一里自界首至同州四十九里南至本府界五十里自界首至陜州一百八十八里北至本府界二百五里自界首至隰州三百三十里東南至本府界八十里自界首至虢州九十五里西南至本府界十一里自界首至華州一百二十九里東北至本府界一百七十五里自界首至絳州九十里西北至本府界三十六里自界首至鄜州三百九里戸主四萬九千三百五十一客五千五百三十六土貢五味子五十斤龍骨一十斤縣七大中祥符四年改寳鼎縣為榮河𨽻慶成軍熈寧元年廢軍以榮河縣𨽻府即縣治置軍使三年省河西縣六年省永樂縣並入河東次赤河東四鄉洿谷河永樂三鎮有中條山拓丘開山五老山黄河媯水汭水次畿臨晉府東北六十五里二鄉有三疑山黄河瀵水次畿猗氏府東北九十五里二鄉有孤山洓水次畿虞鄉府東六十里二鄉有中條山雷首山壇道山次畿萬泉府東北一百五十里二鄉有介山次畿龍門府東北一百八十里二鄉有龍門山黄河汾水次畿榮河府北一百里二鄉北鄉胡壁保士三鎮有黄河汾水睢水古跡古耿國殷帝祖乙自此遷於亳古虞國周封叔仲於此冀帝古國也猗氏古郇國也後以猗頓所居因為猗氏首山官按漢書武帝元豐六年作蒲津關中條山五老山昔堯昇首山觀河渚有五老遊言訖飛上天因以名之龍門山書云導河自龍門是也又梁山北有龍門大禹所鑿厯山漢武因祀后土嘗登厯山媯汭二水源出首山酈元云厯山舜耕處有二源合流入河瀵水按爾雅云瀵水出尾下又按水經云瀵水出汾隂南四十里周廻一百八十步冬温夏冷清澈見底雷水源出雷首山穆天子傳曰天子至雷首犬戎獻良馬使孔牙受之於雷水之缺是也舜井庖王廟舜廟在舜城内蒼陵廟西征記云舜二妃也河瀆廟又有河侯祠漢郊祀志曰祀河於臨晉巨靈祠郭縁生述征記云華山與首陽山本同一山河神巨靈擘開以通河流伯夷叔齊廟庖王陵戴延之西征記云潼關直北隔河望有層阜蒼然獨秀謂之風陵伏羲氏風姓也伯夷叔齊墓孫陽墓荆軻墓大都督府陜州陜郡保平軍節度唐保義軍節度皇朝太平興國元年改保平軍治陜縣地里東京六百五十九里東至本州界九十三里自界首至西京一百九十五里西至本州界一百九十五里自界首至華州八十五里南至本州界八十九里自界首至虢州一十二里北至本州界一百八十八里自界首至絳州七十里東南至本州界七十三里自界首至西京一百七十里西南至本州界六十八里自界首至虢州三十里東北至本州界一百四十五里自界首至解州三十五里西北至本州界一百二十八里自界首至河中府一百九里戸主三萬二千八百四十客一萬一千五百五十三土貢綢緞各一十疋栝樓根柏子仁各一十斤縣七太平興國三年以虢州䦩鄉縣湖城縣𨽻州熈寧四年省湖城縣為鎮入於靈寳六年省硤石縣為鎮入陜元豐六年復置湖城縣上陜六鄉石壕乾壕故縣三鎮有硯頭山二崤山底柱山黄河槖水上平陸州北五里五鄉張店三門集津三鎮有吳山析山上夏州北九十八里七鄉曹張一鎮有巫咸山中條山洓水上靈寳州西四十五里三鄉有夸父山黄河稠桑澤古函谷關中下芮城州西北五十九里二鄉有中條山襄水黄河龍泉下湖城州西南一百一十里一鄉有荆山鑄鼎原鳯林泉鼎湖中下䦩鄉州西一百七十里一鄉歇馬關東二鎮有泰華山黄河玉澗水監二熈寧四年置鑄銅錢八年置鑄鐵錢銅錢州東一百步鐵錢州西五十步古跡召伯甘棠樹在府署西南隅事見詩古魏國城左傳曰姬姓國也芮城商周列國與虞質田於文王者也焦城古焦國姬姓函谷關雷首山禹貢云壺口雷首三門底柱山見地志孔安國云山見水中若柱又鑿為三門者古冶子從齊景公濟於此巫咸山見地志吳山古吳阪麒驥駕鹽車遷延負轅而不進即此處也鼎湖黄帝採首山之銅鑄鼎於荆山下鼎成帝昇天因名其地浢津穆天子傳文天子自顛軨次於浢水之陽水經云漢武帝陽亭長妻此津令其鬻渡傅説祠召伯祠芮君祠夸父廟河上公廟女媧氏陵關龍逄墳中都督府延州延安郡彰武軍節度治膚施縣地里東京一千五百三十里東至本州界二百五十四里自界首至隰州一百二十五里西至本州界一百四十四里自界首至慶州一百九十里南至本州界一百五里自界首至鄜州三十五里北至夏州二百二十二里東南至本州界二百二十里自界首至隰州一百五十四里西南至本州界一百二十里自界首至坊州一百四十里東北至綏德軍三百三十里西北至宥州二百六十四里戸主三萬四千九百一十八客一千八百四十九土貢麝五兩蠟一百斤縣七熈寧五年省豐林縣為鎮金明縣為寨並入膚施八年省延水縣為鎮入延川中膚施一鄉靑化豐林二鎮金明龍門寨安三寨安寨一堡有五龍山伏龍山洛水清水濁涇水中延川州北一百四十里三鄉延水一鎮丹頭綏平懐寧順安白草水平浮圖義合米脂九寨安定黑水二堡永寧關有黄河吐涎水中延長州東一百三十里三鄉有獨戰山濯筋水中門山州東南一百八十里一鄉有重覆山黄河渭牙川水中臨真州東南一百一十里三鄉有庫利川中敷政州西九十里一鄉招安萬安二寨有三塠山洛水中下甘泉州南七十一里一鄉有雕隂山洛水城二康定元年置靑澗熈寧二年廢綏州為綏德城青澗州東北一百八十五里綏德州東北三百三十里監一熈寧八年置鐵錢州城東二里古跡春秋時白翟所居秦白高奴昔趙武靈王滅中山遷其人於膚施即此地五龍池有黄帝五龍祠四所在山上亦謂之仙泉祠州城東西暖泉七眼其味甘美冬温夏冷遇大寒衆泉凍此泉流溢不減甚濟居人龍泉水經云龍泉道左山山有牧龍川多産駿馬望同州馮翊郡定國軍節度唐匡國軍節度周降軍事皇朝太平興國七年為定國軍節度治馮翊縣地里東京一千一百里東至本州界六十里自界首至河中州一十五里西至本州界三十五里自界首至華州四十五里南至本州界三十五里自界首至華州三十五里北至本州界一百九十三里自界首至鄜州一百六十里東南至本州界九十五里自界首至華州四十里西南至本州界五十二里自界首至華州四十里東北至本州界二百六十六里自界首至河中府三十五里西北至本州渠界一百九十里自界首至防州七十五里戸主六萬九千一十四客一萬五百五十六土貢靴皮二十張縣六乾德二年以京兆府奉先縣𨽻州開寳四年改為蒲城天禧四年析𨽻華州熈寧三年省夏陽縣為鎮入郃陽𦂳馮翊一十鄉沙苑一鎮有洛水渭水𦂳澄城州北九十里六鄉寺前良輔二鎮有梁山洛水𦂳朝邑州東三十五里七鄉新市延祥二鎮有黄河渭水上郃陽州東北一百二十里七鄉夏陽一鎮有飛山黄河中白水州西北一百二十里三鄉有五龍山附預山洛水白水中韓城州東北二百里三鄉有大梁山三叠山黄河暢水崌水監一乾德三年於馮翊朝邑二縣境置牧馬監𨽻州沙苑州南二十五里古跡古少梁城古大荔城今謂之古王城向城詩小雅皇父孔聖作都於向古郃陽城古新里城左傳梁伯所城命曰新里古莘國城郡國志云郃陽南有古莘國城散宜生為文王求有莘氏女以獻紂即此地也世系本及詩傳莘國姒姓夏禹之後文母太姒即此國之女古祋祤城三曲城地里志云三業城即此韓城古韓國也賈城古之賈國北芮城漢書地里志云臨晉有芮城古芮國梁山左傳晉梁山崩是也缶浮渡漢淮隂侯虜魏王豹以木罌浮渡夏陽龍首渠史記云臨晉人穿渠得首故以為名子賈廟賈大夫冢張禹冢望華州華隂郡鎮潼軍節度唐鎮軍節度皇朝皇祐五年改鎮潼軍治鄭縣地里東京一千一百里東至本州界九十里自界首至陜州一百七十里西至本州界五十里自界首至京兆府一百里南至本州界五十里自界首至商州一百三十里北至本州界二十里自界首至同州四十里東南至本州界八十里自界首至虢州八十里西南至本州界八十里自界首至京兆府一百里東北至本州界七十里自界首至河中府三十五里西北至本州界七十二里自界首至耀州八十里戸主六萬八千三百四十四客一萬一千八百三十六土貢茯苓細辛各一十斤茯神五斤縣五天禧四年以同州蒲城縣𨽻州熈寧六年省渭南縣為鎮入鄭元豐元年復為縣上鄭七鄉赤水東一鎮有華山聖山渭水符禺水望下邽州西北六十五里七鄉新市來化二鎮有渭水太白渠望蒲城州西北一百二十里九鄉新姚常樂二鎮有金粟山洛水𦂳華隂州東五十里三鄉關西敷水二鎮有泰華山松果山黄河渭水潼關上渭南州西三十五里四鄉赤水西一鎮有靈臺山渭水監二熈寧四年置鑄銅錢八年置鑄鐵錢銅錢州南一里鐵錢州南一里古跡古赤城酈元水經云渭水又東逕山都城北故邑契之所閏駉日