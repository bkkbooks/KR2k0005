  text: 元豐九域志卷八宋王存等撰利州路夔州路利州路府一州九縣一十九闗一次府興元府漢中郡山南西道節度治南鄭縣地里東京二千七百里東至本府界七十五里自界首至洋州三十五里西至本府界一百四十五里自界首至利州二百六十四里南至本府界一百二十五里自界首至巴州一百六十里北至本府界一百八十五里自界首至鳯翔府五百五十里東南至本府界一百一十九里自界首至洋州三十里西南至本府界一百四十五里自界首至三泉縣六十五里東北至本府界七十八里自界首至洋州二十五里西北至本府界一百五十五里自界首至鳯州一百六十里户主四萬八千五百六十七客九千一百六十一土貢胭脂一十斤紅花五十斤縣四次赤南鄭五鄉長栁柏香西條三鎮次畿城固府東六十五里七鄉次畿褒城府西南四十五里二鄉次畿西府西一百里八鄉仙流鐸水二鎮場一茶府西北一里古跡旱山山旁有石牛秦所造以紿蜀者街亭魏張郃與蜀馬謖戰於此斗山開山記云斗山五穴通崑崙諸有千歲蝦蟇名肉芝食之壽千歲韓信壇箕山有秦王獵池冬夏不竭都督府利州益州郡寧武軍節度治綿谷縣地里東京二千六百七十二里東至本州界三百四里自界首至閬州一百一十五里西至本州界二百八十里自界首至文州一百七十里南至本州界一百六十里自界首至劍州七十里北至本州界三百二十五里自界首至興元府二百六十里東南至本州界一百六十五里自界首至閬州七十五里西南至本州界一百八十五里自界首至劍州一百里東北至本州界二百九十五里自界首至巴州二百二十五里西北至本州界七百一十里自界首至階州二百三十五里户主五千五百三十五客一萬六千六百四十四土貢金五兩鋼鐵一十斤縣四中綿谷二十二鄉朝天嘉川二鎮中葭萌州南八十五里九鄉中下嚞川州東一百一十里六鄉下昭化州南三十三里二鄉古跡皇澤寺有唐武后真容殿按士彠為利州都督生后於此望鄉臺鄧艾城望洋州洋川郡武康軍節度治興道縣地里東京二千里東至本州界二百三十九里自界首至金州二百五十里西至本州界三十三里自界首至興元府七十七里南至本州界二百六十八里自界首至巴州三百一十里北至本州界二百三十九里自界首至鳯翔府三百二十里東南至本州界二百一十九里自界首至達州三百二十里西南至本州界三百九十里自界首至巴州四百里東北至本州界三百七十里自界首至京兆府一百二十里西北至本州界四百七十里自界首至鳯州一百八十四里户主三萬二千一百五十九客二萬七千一百三十八土貢隔織八疋縣三望興道二十二鄉茸水一鎮上西鄉州西南八十七里一十五鄉中真符州東南四十九里一十一鄉古跡平陽城漢封班超為定逺侯即此地白公城秦白起嘗為漢中守寒泉秦唐公房師事仙人李八百公房中渴八百以杖指崖出泉即此上閬州閬中郡安徳軍節度治閬巾縣地里東京三千二百里東至本州界七十五里自界首至蓬州一百里西至本州界一百二十里自界首至劍州二百五十五里南至本州界一百二十五里自界首至果州八十里北至本州界七十五里自界首至利州一百六十五里東南至本州界一百七十里自界首至果州一百五十里西南至本州界一百一十四里自界首至梓州一百一十里東北至本州界一百五十里自界首至巴州一百二十里西北至本州界一百二十九里自界首至劍州九十八里户主三萬六千五百三十客一萬七千七百土貢蓮綾一十疋縣七望閬中八鄉緊蒼溪州北四十里六鄉緊南部州南七十一里五鄉緊新井州西七十五里一十三鄉中奉國州東北七十里二鄉中新政州東南一百三十五里三鄉中下西水西一百二十里四鄉古跡玉臺唐刺史滕王常於此遊息雲臺山一名天柱山上有地宜五穀無惡毒可度灾張道陵昇仙之處也上劍州普安郡軍事治普安縣地里東京三千二百里東至本州界八十里自界首至利州一百三十里西至本州界一百九十里自界首至綿州九十里南至本州界二百二十里自界首至閬州九十里北至本州界九十里自界首至利州九十里東南至本州界六十里自界首至利州一百六十里西南至本州界一百八十里自界首至梓州一百一十里東北至本州界七十里自界首至利州一百一十里西北至本州界二百一十里自界首至龍州一百里户主二萬六百五十九客六千五百八十六土貢巴㦸一十斤縣六中下普安九鄉臨津永安二鎮上梓橦州南一百六十里四鄉中隂平州西北一百六十里七鄉中武建州西八十五里五鄉中下普城州南一百四十二里八鄉中下劍門州東北五十五里一十鄉古跡逕油江石牛道張惡子廟華陽國志云梓潼有張惡子祠土人歲上雷杼十枚俗呼為霹靂䃱形如織梭中巴州清化郡軍事治化成縣地里東京三千四百里東至本州界二百九十里自界首至達州二百二十里西至本州界九十五里自界首至閬州一百五十里南至本州界七十里自界首至達州九十里北至本州界二百五十里自界首至興元府二百九十里東南至本州界一百五十里自界首至達州一百五十里西南至本州界七十里自界首至蓬州一百二十里東北至本州界三百五十里自界首至洋州七百里西北至本州界二百三十里自界首至興元府五百里户主八千六百五客二萬三千二百六十一土貢錦五疋縣五中下化城九鄉上難江州北二百六十里五鄉中下恩陽州西南三十里七鄉下曽口州東南三十里五鄉下通江州東一百六十里一十六鄉古跡古巴子國七盤山白馬穴虎牙山姜詩山中下文州隂平郡軍事治曲水縣地里東京三千二十五里