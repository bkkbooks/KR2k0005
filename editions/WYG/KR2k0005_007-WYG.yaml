body:
  text: 元豐九域志卷七宋王存等撰成都府路梓州路成都府路府一州一十二監一縣五十八次府成都府蜀郡劍南西川節度治成都華陽二縣地里東京三千七百里東至本府界六十五里自界首至簡州八十五里西至本府界八十二里自界首至茂州三百九十五里南至本府界五十五里自界首至眉州一百二十五里北至本府界七十五里自界首至漢州二十里東南至本州界一百三十五里自界首至陵井監七十里西南至本府界五十五里自界首至邛州九十五里東北至本府界八十八里自界首至懐安軍七十二里西北至本府界七十六里自界首至彭州九里户主一十一萬九千三百八十八客四萬九千七百二十土貢花羅六疋錦三疋髙紵布一十疋雜色紙五百張縣九次赤成都一十六鄉沲江蠶北二鎮有武擔山大江都江次赤華陽八鄉均窑一鎮有宋興山笮江次畿新都府北四十五里一十六鄉彌犀軍屯二鎮次畿郫府西四十五里一十四鄉犀浦漏街雍店三鎮次畿雙流府南四十里一十七鄉有宜城山牛飲水次畿溫江府西南五十里一十鄉全節安國二鎮次畿新繁府西北五十六里二十八鄉河屯清流二鎮次畿廣都府南四十五里二十二鄉次畿靈泉府東五十里一十五鄉古跡武擔山濯錦江摩訶池昇仙橋相如題柱之所少城張儀所築在大城西文翁學堂琴臺石犀李氷置以厭水怪萬里橋望帝廟笮橋以竹索為之上眉州通義郡防禦治眉山縣地里東京三千六百八十里東至本州界三十五里自界首至陵井監五十里西至本州界九十五里自界首至嘉州一百二十里南至本州界一百里自界首至嘉州五十里北至本州界八十里自界首至蜀州九十里東南至本州界八十七里自界首至嘉州九十六里西南至本州界九十里自界首至嘉州七十里東北至本州界三十一里自界首至陵井監五十二里西北至本州界七十里自界首至邛州七十里户主四萬八千一百七十九客二萬七千九百五十土貢麩金五兩巴荳一升縣四望眉山二十鄉望彭山州北四十里一十九鄉望丹稜州西六十五里七鄉緊青神州南六十五里四鄉古跡白虎山秦昭王時白虎為害邑人康仲作伏虎弩射殺之魚鳧津一名彭女津彭女山昔有綵女從彭祖學道於此鼎鼻山周衰九鼎淪散其一後於此山下江中或見其鼻緊蜀州詹安郡軍事治晉源縣地里東京三千八百里東至本州界四十五里自界首至成都府五十五里西至賢宮山二百五十里南至本州界二十里自界首至邛州五十里北至本州界五十五里自界首至茂州三百六十六里東南至本州界九十里自界首至眉州八十五里西南至本州界二十里自界首至邛平州六十里東北至本州界三十里自界首至成都府七十里西北至本州界五十五里自界首至茂州三百四十六里户主六萬五千五百九十九客一萬三千三百二十八土貢春羅四疋單絲羅一十疋縣五望晉源二十五鄉洞口一鎮有鶴鳴山斜江望新津州東南七十里十五鄉新穿方井二鎮望江源州東南三十里二十鄉金馬萬集二鎮有郪江望永康州西五十里八鄉新渠一鎮一茶場望青城州北五十里一十五鄉陶埧味江掤市白江四鎮古跡瞿君祠後漢瞿武七歲絶食服黄精紫芝入峩眉山天皇真人授以真訣乗白龍而去稠稉山即二十四化之一郪江出麩金天國山青城山記云青城有大八洞此其一也石笋山上有石笋孤立十餘丈古臨邛城卓王孫塚緊彭州濛陽郡軍事治九龍縣地里東京三千五百八十七里東至本州界四十六里自界首至漢州一十五里西至本州界九十三里自界首至茂州三百七十里南至本州界一十六里自界首至成都府七十六里北至本州界三十六里自界首至漢州七十五里東南至本州界一十五里自界首至成都府七十二里西南至本州界七十八里自界首至蜀州九十七里東北至本州界四十六里自界首至漢州二十里西北至茂州山八十里户主五萬七千四百二十八客一萬四千九百九十六土貢羅一十疋縣四望九龍三十鄉棚口木頭二鎮鹿角一寨望永昌州西二十六里二十三鄉一茶場望濛陽州東三十一里一十四鄉有羅江瀰濛水望導江州西七十五里二十鄉導江蒲村唐興三鎮古跡光武祠二葛仙化王元化九龍山屈曲九折因名之葛璝山二十四化之一彭門山上綿州巴西郡軍事治巴西縣地里東京三千五百里東至本州界一百三十五里自界首至劍州二百二十二里西至本州界一百七十里自界首至茂州二百一里南至本州界一百二十里自界首至梓州一百四十八里北至本州界一百四十四里自界首至龍州七十五里東南至本州界三十七里自界首至梓州一百里西南至本州界一百五里自界首至漢州八十四里東北至本州界九十四里自界首至劍州二百里西北至本州界一百五十里自界首至龍州一百二十二里户主一十萬六千六十四客一萬七千八十五土貢綾五疋紵布一十疋縣八望巴西二十二鄉望彰明州北七十一里二十鄉緊魏城州東六十五里一十鄉緊羅江州南七十里一十鄉上神泉州西八十五里十鄉石城一鎮石闗一寨上龍安州西北九十四里一十四鄉中鹽泉州東一百二十里五鄉石羊石匙二寨下石泉州西二百四十四里二鄉石門一鎮古跡羅璝山羅公逺隠於此十八隴山石新婦昔有人逺征妻送至此化為石廣濟陂唐時開大溉民田李太白碑鄧艾廟譙周墓上漢州徳陽郡軍事治雒縣地里東京三千五百二十六里東至本州界三十二里自界首至梓州一百五十里西至本州界三十里自界首至懐安軍七十里南至茂州界二百二十五里北至綿州山一百二十一里東南至本州界五十二里自界首至梓州一百三十八里西南至本州界二十里自界首