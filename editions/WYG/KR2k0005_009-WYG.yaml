body:
  text: 元豐九域志卷九宋王存等撰福建路廣南路東路西路福建路太平興國二年為兩浙西南路雍熈二年改福建路州六軍二縣四十五大都督府福州長樂郡威武軍節度唐威武軍節度周改彰武軍皇朝太平興國二年復舊治閩侯官二縣地里東京四千七百里東至海一百九十里西至本州界二百六十里自界首至南劒州一百二十五里南至本州界一百五十六里自界首至興化軍六十五里北至本州界六百六十五里自界首至處州三百五十里東南至海二百八里西南至本州界二百五十里自界首至南劒州四百二十五里東北至本州界五百四十里自界首至温州二百里西北至本州界五百八十里自界首至建州四百四十里户主一十一萬四千六百三十六客九萬六千九百一十六土貢紅花蕉布三十疋縣一十二太平興國五年析閩縣地置懐安縣天禧五年改永貞縣為永昌乾興元年改羅源望閩一十二鄉閩安一鎮望侯官九鄉望福清州東南一百七十七里七鄉海口一鎮一鹽倉望懐安州西北二十里九鄉望長溪州東北五百四十五里四鄉黄崎一鎮玉林一銀場一鹽場望連江州東北一百六十里五鄉望古田州西北一百八十里四鄉水口一鎮寳興一銀場古田一金坑𦂳長樂州東一百二十里四鄉一鹽場𦂳永泰州西南三百五十里三鄉黄洋保徳二銀場中寜徳州東北三百里三鄉闗𨽻一鎮古跡北仙山越王元諸九月九日嘗宴於此大石為樽尚存越王山即越王舊城中有越王井金崎江鱔溪有大鱔長丈餘石鼓山行山郡國志云閩縣有行山一名霍山形似香爐飛山越王時自海飛來越王石方輿記云嘗隱雲霧中惟清廉太守乃得見宋虞愿觀見之營頭戍越王所置螇江搜神記云閩人謝端釣得異螇因名之香爐山道士章夀於此學道延平津有蛟龍害人夀入水斬之爐山仙人壇唐天寳七載置仙遊山列仙霍童遊處之所本名霍童山天寳中改之峰上有人一小石甕中有水味甚甘峯南有石步廊石堂東復有石橋跨澗居人或時聞鐘鼓之音佛跡石大磬石上有大足跡昔有胡僧經此云是佛跡海壇山石亢嶺大妃山故老云越王𦵏溪岸大石山上上建州建安郡建寜軍節度偽閩鎮武軍節度偽唐改永安軍又改中義軍後降軍事皇朝端拱元年行建寜軍節度治建安縣地里東京三千五百里東至本州界一百八十里自界首至處州六百三十里西至本州界一百六十里自界首至南劒州一百里南至本州界九十七里自界首至南劔州六十五里北至本州界三百里自界首至信州一百里東南至本州界三百五十里自界首至福州五百六十里西南至本州界八十里自界首至南劍州一百三十里東北至本州界四百七里自界首至衢州二百里西北至本州界一百八十里自界首至邵武軍七十三里户主六萬九千一百二十六客一十二萬七千四百四十土貢龍鳳等茶八百二十斤練五十疋縣六太平興國四年以將樂縣𨽻南劔州五年以邵武歸化建寜三縣𨽻邵武軍淳化五年升崇安場為縣咸平三年析建安建陽浦城三縣地置歐寜縣熈寜三年罷望建安七鄉石舍永興丁地三銀場望建陽州西一百三十里六鄉望浦城州東北三百三十里一十鄉遷陽臨江二鎮通徳潘家山余桑三銀場余生蕉溪觔竹三銀坑望崇安州北二百五十里五鄉𦂳政和州東南二百二十里四鄉舊一鎮天受一銀場上松溪州東二百六十里三鄉監一咸平三年置鑄銅錢豐國州城東北古跡梨山郡之勝槩也梅福山方輿記云福煉丹於此今有昇仙壇茶山仙人州一名墜馬州蕭子開建安記云海真人上昇墜馬於此小松溪玉清洞圖經云晉世有漁者游潭中見石室額有金字云玉清洞因前升其庭有人出曰司命之府也漁者駭而退夢筆山俗云江淹夢筆之所武夷山漢祀山浮石山芹溪子期山建安記華子期嘗師角里先生得隱仙靈寳之法後居此山湛爐山圖經云昔湛王鑄劒於其上因名之九石潭越王臺武夷君廟雞巖建安記云與武夷山相對半巖有雞窠焉洞宫山圖經云洞中有蓮花石有人遊之獲石龜鶴藤竹仙人繩上泉州清源郡平海軍節度治晉江縣地里東京四千一百三十里東至海一百三十里西至本州界三百一十里自界首至南劍州三百四十里南至海一百三十里北至本州界一百里自界首至興化軍一百二十里東南至海八十里西南至本州界二百三十五里自界首至漳州一百四十里東北至本州界九十里自界首至興化軍七十里西北至本州界四百里自界首至南劔州三百里户主一十四萬一千一百九十九客六萬二百七土貢綿一百兩蕉葛各一十疋縣七太平興國四年以莆田仙遊二縣𨽻興化軍五年以長太縣𨽻漳州六年析晉江縣地置惠安縣上晉江五鄉鹽一百六十一亭中南安州西一十三里八鄉中同安州西一百三十五里三鄉安仁上下馬欄莊陂四鹽場中惠安州北四十七里三鄉鹽一百二十九亭中永春州西一百三十里五鄉倚洋一鐡場下清溪州西一百五里四鄉青陽一鐡場下徳化州西北一百八十五里五鄉丘店一寨赤水一鐡場古跡夾山廟每嵗旱祈禱多應故祠祀特盛島嶼在海中上有居民晉江樂洋江放生池天水淮唐太和三年刺史趙棨所開長二百三十步尚書塘刺史趙昌置號常稔塘後昌為户部尚書鎮南海因改為尚書塘趙街在晉江縣西一百步刺史趙棨所開長二百三十步濶一十六步飛揚神廟晉太康中夜有雷電起於廟廷明已移於江北在水北故曰飛揚廟延福寺中有西峯即唐徴君所處有石題曰髙士峯佛跡山上有足跡故老相傳以為佛跡金雞山蕉山桃林溪九竇山卧龍山王髻岱嶼山在海中錦田山越王山韓涯墓上南劒州劍浦郡軍事偽唐劍州皇朝太平興國四年以利州路有劍州加南字治劍