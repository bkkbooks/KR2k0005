body:
  text: 元豐九域志卷六宋王存等撰江南路東路西路荆湖路南路北路江南路太平興國元年無東西路後併一路天禧四年後分二路東路府一州七軍二縣四十八次府江寧府建康軍節度治上元江寜二縣地里東京一千二百四十五里東至本府界一百四十里自界首至潤州四十里西至本府界一十里自界首至和州八十三里南至本府界二百四十里自界首至宣州一百二十里北至本府界四十九里自界首至真州一百一十里東南至本府界二百八十五里自界首至常州一百八十五里西南至本府界九十里自界首至太平州三十里東北至本府界一百三十五里自界首至潤州四十五里西北至本府界二十二里自界首至真州一百二十九里户主一十一萬八千五百九十客四萬九千八百六十五土貢筆五百管縣五次赤上元一十一鄉次赤江寧二十一鄉次畿句容府東九十里一十七鄉次畿溧水府東八十五里一十七鄉次畿溧陽府東南二百四十里一十鄉古跡金陵楚威王以此地有王氣埋金鎮之故曰金陵丹陽城丹陽郡北有赭山丹赤以為郡名雁門山石頭城華林國烏衣巷茅山即三十六洞天之第八洞也望宣州宣城郡寧國軍節度治宣城縣地里東京一千七百里東至本州界六十五里自界首至廣徳軍一百一十五里西至本州界二百一十一里自界首至池州一百四十九里南至本州界二百六十八里自界首至歙州一百里北至本州界一百五里自界首至太平州七十五里東南至本州界一百一十里自界首至杭州二百八十里西南至本州界一百八十里自界首至池州一百五十里東北至本州界二百二十四里自界首至太平州七十五里西北至本州界二百一十一里自界首至池州六十里户主一十二萬九百五十九客二萬一千八百五十三土貢白紵布一十疋黄連三十斤筆五百管縣六望宣城一十三鄉望南陵州西一百五里八鄉𦂳涇州西一百五里一十一鄉𦂳寧國州南一百一十里一十五鄉𦂳旌徳州西南二百四十五里七鄉中太平州西南二百四十里九鄉古跡昭亭山在宛陵北花姑山即麻姑山有仙壇在焉謝公亭謝𤣥暉置琴溪琴髙控鯉之地劉遺民釣臺葛洪煉丹井石鼓山天欲雨石鼓鳴棲真山浮丘公仙壇上歙州新安郡軍事治歙縣地里東京二千一百七十里東至本州界一百四十三里自界首至杭州三百三十六里西至本州界二百八十三里自界首至池州二百七十三里南至本州界一百六十四里自界首至睦州二百六十三里北至本州界八十里自界首至軍州三百三十六里東南至本州界一百一十里自界首至睦州二百六十里西南至本州界三百九里自界首至饒州四百八十六里東北至本州界一百三里自界首至宣州二百八十里西北至本州界二百八十五里自界首至宣州一百五里户主一十萬三千一百一十六客二千八百六十八土貢白苧一十疋紙一千張縣六望歙一十六鄉望休寧州西六十六里一十一鄉望祁門州西一百七十九里七鄉望婺源州西南二百九里六鄉望績溪州東北六十六里九鄉望黟州西一百五十三里四鄉古跡黟山鳯皇山揚之水玉魚松蘿山顏公山昔有顏公隠此後乗風去靄峰李白詩靄峰尖似筆是也石墨井上江州潯陽郡軍事治徳化縣地里東京一千八百里東至本州界二百一十里自界首至饒州九十里西至本州界一百五十里自界首至興國軍二百五十里南至本州界九十里自界首至南康軍三十里北至本州界二十五里自界首至蘄州二百七十五里東南至本州界三十里自界首至南康軍六十里西南至本州界四十五里自界首至洪州一百五十五里東北至本州界二百七十五里自界首至池州二百五里西北至本州界二十里自界首至蘄州二百七十五里户主七萬五千八百八十八客一萬九千四百九十六土貢生石斛雲母各一十斤縣五望徳化一十三鄉緊徳安州西南九十里四鄉中瑞昌州西一百二十里八鄉中湖口州東北六十里四鄉中彭澤州東二百一十里八鄉監一鑄銅錢廣寧州南一百二十步古跡大江九江廟白公祠堂董真君祠堂九江湓浦孤石在彭蠡湖心中庾亮樓陶濳宅謝靈運翻經臺上池州池陽郡軍事治貴池縣地里東京二千一百里東至本州界一百五十里自界首至宣州一百七十五里西至本州界三百六十里自界首至江州一百六十里南至本州界二百八十里自界首至歙州二百五里北至本州界三十里自界首至舒州三百二十里東南至本州界二百二十里自界首至宣州三百里西南至本州界三百八十里自界首至饒州一百九十里東北至本州界一百七十里自界首至宣州一百六十五里西北至本州界四十里自界首至舒州三百二十里户主一十萬六千六百五十七客二萬四千七百八土貢紙一千張縣六望貴池七鄉上貴陽州東南一百里九鄉上銅陵州東北一百四十里五鄉上建徳州西二百四十里四鄉上石埭州東南二百里五鄉中下東流州西北二百三十里四鄉監一鑄銅錢永豐州東北二里古跡九華山舊名九子山上有九峯杏山葛仙翁種杏處許旌陽印文昔旌陽逐蛟至此有印文在西岸崖壁上馬當山上饒州鄱陽郡軍事治鄱陽縣地里東京二千四百一十里東至本州界三百九十里自界首至歙州三百九里西至本州界一百七十里自界首至洪州五百六十八里南至本州界二百六十一里自界首至撫州一百六十三里北至本州界一百九十里自界首至池州三百八十里東南至本州界二百九十里自界首至信州三百五十里西南至本州界一百六十里自界首至洪州二百一十里東北至本州界三百八十里自界首至歙州三百八十里西北至本州界一百五十七里自界首至南康軍二百二十二里户主一十三萬