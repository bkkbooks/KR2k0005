body:
  text: 元豐九域志卷十宋王存等撰省廢州軍京東路廣濟軍乾德元年以曹州定陶縣建軍熙寧四年廢京西路光化軍乾德二年以襄州榖城縣建軍熙寧五年廢河北路通利軍端拱元年以澶州黎陽縣建軍熙寧三年廢承天軍建隆元年以真定府娘子關建軍後廢陜西路乾州熙寧五年廢儀州熙寧五年廢綏州熙寧二年廢河東路沁州太平興國六年廢慈州熙寧五年廢平晉軍太平興國四年廢靜樂軍咸平二年廢淮南路天長軍至道三年廢漣水軍熙寧五年廢兩浙路順化軍太平興國五年廢江隂軍缺廢荆湖路復州熙寧六年廢漢陽軍熙寧四年廢荆門軍熙寧六年廢利州路集州熙寧三年廢璧州開寶五年廢大安軍至道三年廢廣南路富州開寶五年廢巒州開寶五年廢潘州開寶五年廢澄州開寶五年廢勤州開寶五年廢常樂州開寶五年廢繡州開寶五年廢禺州開寶五年廢順州開寶五年廢思明州開寶六年廢瀧州開寶六年廢溥州乾德元年廢巖州開寶七年廢黨州開寶五年廢牢州開寶五年廢羅州開寶五年廢太平軍太平興國八年廢恩剛州天禧四年廢歸恩州慶厯三年廢芝欣州慶厯三年廢紆州慶厯三年廢竇州太平興國四年廢南儀州熙寧四年廢蒙州熙寧五年廢春州熙寧六年廢崖州開寶五年廢化外州河北路安東上都護府幽州慎州易州缺州檀州平州薊州營州歸順州遼州師州順州瑞州陜西路安西大都護府庭州靈州夏州涼州沙州鄯州瓜州銀州鹽州勝州宥州西州廓州會州宕州疊州甘州肅州伊州洮陽州建康州鎮州河東路安北大都護府單于大都護府鎮北大都護府雲州應州新州蔚州媯州朔州寰州儒州毅州利州路松州扶州翼州當州悉州恭州柘州直州保州靜州夔州路思州費州播州夷州牂州西髙州業州充州莊州琰州廣南路交州峯州瀼州嚴州田州愛州歡州陸州福祿州長州粵州溫州林州景州環州平琴州演州山州武安州古州德化州即茫州琳州羈縻州荆湖路上溪州下溪州忠彭州化州南州謂州衣順州溪寧州感化州洛州㹫州溪藍州新府州順州保靜州古州万州費州逺州奉州襄州許賜州越州寧化州向化州歸明州新定州歸信州保安州順現州保富州安永州永州新化州逺富州新賜州已上北江懿州綿州已上南江成都府路羅嚴州索古州秦上州合欽州劇川州輒榮州蓬州柏坡州博盧州明川州胣粗州蓬矢州大復州米川州大屬州河東州諾莋州甫嵐州昌明州歸化州象川州叢夏州和良州和都州附木州東川州上貴州滑川州北川州吉川州甫嵾州北地州蒼榮州野川州卬陳州貴林州護川州牒綜州浪獮州郎郭州上欽州時蓬州儼馬州查州卬川州護卬州腳川州開望州上蓬州北蓬州剝重州久護州瑶劍州明昌州右五十四州𨽻黎州當馬州三井州來峯州名配州鉗苯州斜恭州盡重州羅林州籠羊州林波州林燒州龍蓬州敢川州驚川州禍眉州木燭州百坡州當品州嚴城州中川州鉗矣州昌磊州鉗并州百頗州會野州當仁州推梅州作重州福林州金林州諾柞州三恭州布嵐州欠馬州論川州讓川州逺南州卑盧州耀川州金川州東嘉梁州西嘉梁州右四十二州𨽻雅州璫州直州時州塗州達州飛州乾州可州向州居州右十州𨽻茂州保州霸州右二州𨽻威州梓州路連州照州獻州南州洛州盈州德州為州扶德州移州播朗州筠州武昌州志州已上在南廣溪洞商州馴州浪川州騁州已上在馮湖江協州切騎州靖州曲州哥靈州品州牱違州碾衛州滈州從州播陵州鉗州已上在石門路右三十州𨽻戎州納州薛州晏州鞏州奉州悅州思峨州長寧州能州淯州浙州定州朱州順州藍州溱州髙定州姚州右十八州𨽻瀘州夔州路南寧州琬州犍州清州蔣州短州蠻州龔州峨州邦州鶴州勞州義州福州儒州今州郝州普寧州緣州郡州鸞州絲州功州敷州晃州侯州焚州添州珤州雙城州訓州卿州茂龍州婺州懸州樂善州撫水州思無州逸州恩州南平州勳州薑州稜州鴻州和武州暉州亮州鼓州右四十九州𨽻黔州溱州右一州𨽻渝州廣南路籠州忠州凍州江州萬承州思陵州左州思誠州談州渡州七源州西平州上思州祿州石西州思浪州思同州安平州真州廣原州勒州南源州西農州萬崖州覆利州溫弄州武黎州羅陽州陀陵州永康州已上左江武峩州籠武州思恩州鶼州思城州勘州歸樂州倫州萬州蕃州昆明州婪鳳州侯唐州歸恩州田州功饒州歸誠州龍川州已上右江右四十八州𨽻雍州樂善州右一州𨽻融州溫泉州環州鎮寧州思順州蕃州文州金城州蘭州歸化州述昆州智州安化州南丹州右一十三州𨽻宜州元豐九域志卷十
