body:
  text: 元豐九域志卷十宋王存等撰省廢州軍京東路廣濟軍乾徳元年以曹州定陶縣建軍熈寜四年廢京西路光化軍乾徳二年以襄州榖城縣建軍熈寜五年廢河北路通利軍端拱元年以澶州黎陽縣建軍熈寜三年廢承天軍建隆元年以真定府孃子闗建軍後廢陜西路乾州熈寜五年廢儀州熈寜五年廢綏州熈寜二年廢河東路沁州太平興國六年廢慈州熈寜五年廢平晉軍太平興國四年廢靜樂軍咸平二年廢淮南路天長軍至道三年廢漣水軍熈寜五年廢兩浙路順化軍太平興國五年廢江隂軍缺廢荆湖路復州熈寜六年廢漢陽軍熈寜四年廢荆門軍熈寜六年廢利州路集州熈寜三年廢璧州開寳五年廢大安軍至道三年廢廣南路富州開寳五年廢巒州開寳五年廢潘州開寳五年廢澄州開寳五年廢勤州開寳五年廢常樂州開寳五年廢繡州開寳五年廢禺州開寳五年廢順州開寳五年廢思明州開寳六年廢瀧州開寳六年廢溥州乾徳元年廢巖州開寳七年廢黨州開寳五年廢牢州開寳五年廢羅州開寳五年廢太平軍太平興國八年廢恩剛州天禧四年廢歸恩州慶厯三年廢芝忻州慶厯三年廢䊸州慶厯三年廢竇州太平興國四年廢南儀州熈寜四年廢蒙州熈寜五年廢春州熈寜六年廢崖州開寳五年廢化外州河北路安東上都䕶府幽州慎州易州缺州檀州平州薊州營州歸順州遼州師州順州瑞州陜西路安西大都䕶府庭州靈州夏州凉州沙州鄯州𤓰州銀州鹽州勝州宥州西州廓州㑹州宕州叠州甘州肅州伊州洮陽州建康州鎮州河東路安北大都䕶府單于大都䕶府鎮北大都䕶府雲州應州新州蔚州媯州朔州寰州儒州毅州利州路松州扶州翼州當州悉州恭州柘州直州保州靜州䕫州路思州費州播州夷州䍧州西髙州業州充州莊州琰州廣南路交州峯州瀼州嚴州田州愛州驩州陸州福禄州長州粤州温州林州景州環州平琴州演州山州武安州古州徳化州即茫州琳州覊縻州荆湖路上溪州下溪州忠彭州化州南州謂州衣順州溪寜州感化州洛州㹫州溪藍州新府州順州保靜州古州万州費州逺州奉州襄州許賜州越州寜化州向化州歸明州新定州歸信州保安州順現州保富州安永州永州新化州逺富州新賜州已上北江懿州緜州已上南江成都府路羅嚴州索古州秦上州合欽州劇川州輒榮州蓬州栢坡州博盧州明川州胣䏢州蓬矢州大復州米川州大屬州河東州諾莋州甫嵐州昌明州歸化州象川州叢夏州和良州和都州附木州東川州上貴州滑川州北川州吉川州甫嵾州北地州蒼榮州野川州卬陳州貴林州䕶川州牒綜州浪獮州郎郭州上欽州時蓬州儼馬州查州卬川州䕶卬州脚川州開望州上蓬州北蓬州剥重州乆䕶州瑶劍州明昌州右五十四州𨽻黎州當馬州三井州來峯州名配州鉗苯州斜恭州盡重州羅林州籠羊州林波州林燒州龍蓬州敢川州驚川州禍眉州木燭州百坡州當品州嚴城州中川州鉗矣州昌磊州鉗并州百頗州㑹野州當仁州推梅州作重州福林州金林州諾柞州三恭州布嵐州欠馬州論川州讓川州逺南州卑盧州耀川州金川州東嘉梁州西嘉梁州右四十二州𨽻雅州璫州直州時州塗州達州飛州乾州可州向州居州右十州𨽻茂州保州霸州右二州𨽻威州梓州路連州照州獻州南州洛州盈州徳州為州扶徳州移州播朗州筠州武昌州志州已上在南廣溪洞商州馴州浪川州騁州已上在馮湖江協州切騎州靖州曲州哥靈州品州牱違州碾衛州滈州從州播陵州鉗州已上在石門路右三十州𨽻戎州納州薛州晏州鞏州奉州悦州思峨州長寜州能州淯州浙州定州朱州順州藍州溱州髙定州姚州右十八州𨽻瀘州䕫州路南寜州琬州犍州清州蔣州短州蠻州龔州峨州邦州鶴州勞州義州福州儒州今州郝州普寜州縁州郡州鸞州絲州功州敷州晃州侯州焚州添州珤州雙城州訓州卿州茂龍州婺州懸州樂善州撫水州思無州逸州恩州南平州勲州姜州稜州鴻州和武州暉州亮州鼓州右四十九州𨽻黔州溱州右一州𨽻渝州廣南路籠州忠州凍州江州萬承州思陵州左州思誠州譚州渡州七源州西平州上思州禄州石西州思浪州思同州安平州真州廣原州勒州南源州西農州萬崖州覆利州温弄州武黎州羅陽州陁陵州永康州已上左江武峩州籠武州思恩州鶼州思城州勘州歸樂州倫州萬州蕃州昆明州婪鳳州侯唐州歸恩州田州功饒州歸誠州龍川州已上右江右四十八州𨽻邕州樂善州右一州𨽻融州温泉州環州鎮寜州思順州蕃州文州金城州蘭州歸化州述昆州智州安化州南丹州右一十三州𨽻宜州元豐九域志卷十
