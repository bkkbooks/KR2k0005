body:
  text: 元豐九域志卷二宋王存等撰河北路東路西路河北路太平興國二年分河北南路雍熙四年分東西路端拱二年併一路熈寧六年復分二路東路北京見上州一十二軍四縣四十開德府澶州澶淵郡鎮寧軍節度治濮陽縣地里東京二百五十里東至本州界三十里自界首至濮州六十里西至本州界七十里自界首至衛州一百七十里南至本州界七十里自界首至滑州二十五里北至本州界八十里自界首至北京六十里東南至本州界四十五里自界首至曹州一百三十五里西南至本州界七十四里自界首至滑州二十五里東北至本州界八十八里自界首至博州五十二里西北至本州界九十五里自界首至博州二百二十五里戸主三萬六千六百三十七客一萬九千三百五十二土貢席二十領胡粉一十斤縣五雍熈四年以滑州衛南黎陽二縣𨽻州端拱元年以黎陽縣𨽻通利軍省臨黄縣入觀城慶厯四年徙清豐縣治德淸軍即縣治置軍使𨽻州皇祐元年省觀城縣入濮陽頓丘四年復置觀城縣熈寧六年省頓丘縣入淸豐中濮陽六鄉有衛陽山鮒鰅山黄河淇水瓠子口望觀城州東九十里六鄉有黄河泉源河𦂳臨河州西六十里二鄉土樓一鎮有黄河水濟渠澶源中清豐州北六十里二鄉清豐舊州二鎮有廣陽山黄河中衛南州西南五十里二鄉有九里溝古跡帝丘本顓頊之墟夏后之世昆吾氏顓頊城顓頊之所都昆吾臺新臺子夏詩序云衛宣公作新臺于河上即此也衛靈公臺舊記云亦名重華之臺楚丘城春秋時衛文公自漕邑遷於楚丘以避狄山海經云文帝塟於狄山隂今陵見存廣陽山寰宇記附隅山今名廣陽山也山海經云漢水出鮒鰅之山景山詩云望楚與堂景山與京旄丘爾雅云前高後下曰旄丘詩云旄丘之葛兮謂此瑕丘禮記檀弓云公叔文子遊瑕丘蘧伯玉從文子曰樂哉斯丘也壇首春秋襄二十年澶淵是也瓠子河决漢武帝塞之白馬玉璧將軍以下皆負薪是也衛大夫祠即季路也為孔悝邑宰故稱大夫顓頊陵史記皇覧曰在頓丘城門外廣陽里中帝嚳陵皇覧曰在頓丘城南孔悝墓汲黯墓上滄州景城郡横海軍節度治清池縣地里東京一千三百里東至海一百八十里西至本州界六十八里自界首至瀛州一百一十二里南至本州界一百五十五里自界首至德州四十五里北至幽州五百七十五里東南至本州界二百四十里自界首至濱州六十里西南至本州界一百五十八里自界首至德州五十二里東北至海二百五十里西北至本州界九十六里自界首至瀛州一百二十里戸主五萬二千三百七十六客四千五百三十五土貢絹一十疋柳箱一十枚縣五治平元年從無棣縣治保順軍即縣治置軍使𨽻州熈寜二年徙樂陵縣治咸平鎮五年省饒安縣為鎮入青池六年省臨津縣為鎮入南皮望清池一十一鄉任河長蘆郭疃饒安四鎮乾符巷姑三女泥沽小南河五寨有浮陽水徒駭河望無棣州東南一百七十里五鄉無棣劇口車店三鎮有老烏山鬲津河無棣河𦂳鹽山州東六十里四鄉㑹寧通商韋家北三鎮有鹽山浮水𦂳樂陵州南一百三十五里七鄉歸化屯莊馬逮郭橋楊攀口東西保安七鎮有鬲津河馬河鈎盤河中南皮州西南六十里六鄉南皮馬明樂延臨津四鎮有小天台山濟河古跡三河易水白馬泥池三水合故名三河百木門城春秋子鮮出奔於木門凉馬臺輿地志云漢武帝所築騮山本無棣邑左氏傳北至於無棣是也漢武臺輿地志云漢武帝至此築無棣河一名赤河圖經云漢破黄巾賊流血潢河故名赤河鬲津河徒駭河鉤盤河駕馬河輿地志云即馬頰河太史河胡蘇河已上皆九河之數子童城齊記云秦使方士徐福將童男女千人求蓬萊築此城胡蘇亭漢志云東光有胡蘇亭醼友臺圖經云魏文帝為五官中郎將與吳質重遊南皮築此臺故名焉袁侯臺圖經云曹公逐袁譚於南皮於此城中築臺眺望秦茅焦墓十道志茅焦齊人説秦始皇迎母者尹吉甫墓商不疑墓上冀州信都郡安武軍節度慶厯八年升安武軍節度治信都縣地里東京七百五十里東至本州界八十里自界首至德州一百一十里西至本州界九十里自界首至趙州九十里南至本州界五十里自界首至恩州七十里北至本州界七十里自界首至瀛州一百七十里東南至本州界五十里自界首至博州二百七十里西南至本州界九十里自界首至邢州二百二十里東北至本州界一百七十里自界首至永靜軍三十里西北至本州界七十五里自界首至深州一十五里戸主四萬二千客九千一百三十六土貢絹二十疋縣六淳化元年以阜城縣𨽻永靜軍皇祐四年省堂陽縣為鎮入南宫升新河鎮為縣嘉祐八年省武邑縣為鎮入蓨熈寧元年省棗彊縣為鎮入信都六年省新河縣為鎮入南宫十年復置棗彊武邑縣望信都五鄉劉固宗齊來逺三鎮有胡蘆河降水上蓨州東北一百五十里二鄉王貫李億二鎮有漳河蓨市上南宫州西南六十二里三鄉長廬新河堂陽三鎮有降水枯瀆上棗彊州東南五十五里二鄉湯家一鎮有漳河上武邑州東北九十里二鄉觀津一鎮有漳河長蘆河中衡水州北三十八里二鄉有長蘆河降水古跡扶柳城圖經云縣有扶澤多柳因號扶柳城劉梅嘗據此城以迎州祖堯壇觀津城按史記漢文竇皇后淸河觀津人也古賢未城中三州未有條京城古厯城水經注淸漳水經厯城南即此城也昌亭城水經云漳水東北至昌亭合滂沲衡漳水今長蘆河則其故瀆也堂陽本漢縣城冢記云商皇太子封母弟才為堂陽侯在堂之陽故名之九門城按城冢記云鮌所造也堯臺見城冢記郡國志云有二所並號堯臺善縓城城冢記云夏上劉縓造漢董仲舒墳漢常山王張耳墓漢亞相綘侯周亞夫墓漢南宫侯張歐冢河間府瀛州河間郡防禦治河