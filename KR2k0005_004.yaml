body:
  text: 元豐九域志卷四宋王存等撰河東路河東路府一州十五軍六縣七十五次府太原府太原郡河東節度唐河東節度周初劉崇竊據皇朝太平興國四年克復降緊州軍事嘉祐四年復為太原府河東節度治陽曲縣地里東京一千二百里東至本府界一百六十里自界首至遼州一百八十里西至本府界二百里自界首至石州一百八十里南至本府界三百四十里自界首至遼州一百二十六里北至本府界一百一十里自界首至欣州五十五里東南至本府界一百六十里自界首至遼州一百八十五里西南至本府界二百里自界首至汾州六十里東北至本府界二百里自界首至真定府一百里西北至本府界一百七十里自界首至嵐州一百二十五里户主七萬八千五百六十六客二萬七千五百七十二土貢銅鑑一十面甘草參礬石各十斤縣九建隆四年以晉陽縣為平晉軍太平興國四年廢軍為縣省太原縣入榆次改廣陽縣為平定升樂平縣𨽻平定軍以交城縣𨽻大通監寶元二年交城縣復𨽻府熙寧三年省平晉縣入陽曲次赤陽曲八鄉百井陽興二寨次畿太谷府南一百里三鄉次畿榆次府東南七十里一十四鄉次畿壽陽府東一百八十里四鄉次畿孟府東北二百里四鄉有滹沱水次畿交城府西南一百里四鄉次畿文水府西南一百四十里七鄉次畿祁府南一百一十里五鄉次畿清源府西南七十里六鄉監二太平興國四年以交城縣置大通監六年以沁州綿上縣𨽻焉九年於平晉縣置監務咸平四年升為永利監大聖元年改大通為交城明道二年復舊寶元二年以大通監𨽻府俾如交城縣兼領鹽事大通府西南一百里永利府東二十二里古迹古太原城一名晉陽城皇朝克復河東移治今郡此城隳廢臺駘寺左傳云允格臺駘能業其官帝用嘉之封諸汾州又曰臺駘障大澤以處太原祁藪職方氏云并州其藪曰昭餘祁洮水左氏云宣汾洮是也清源左傳曰晉侯搜於清原郜城左傳曰焚我箕郜大陵城趙肅侯遊大陵見史記仇猶城智伯欲仇猶遺之大鐘見戰國策智伯渠智伯決晉水灌晉陽城見春秋後語子夏廟羊舌大夫廟晉侯墓晉大夫祁奚墓後漢徵士周黨墓溫舒墓孝子劉明達墓郭有道碑蔡伯喈文并書次龍德府潞州上黨郡昭德軍節度唐昭義軍節度皇朝太平興國元年改昭德軍治上黨縣地里東京七百二十里東至本州界一百二十里自界首至相州一百里西至本州界一百四十七里自界首至晉州二百四十里南至本州界六十五里自界首至澤州一百里北至本州界一百四十五里自界首至遼州二百三里東南至本州界八十里自界首至澤州一百四十里西南至本州界七十五里自界首至澤州一百一十里東北至本州界一百二十八里自界首至遼州一百一十五里西北至本州界一百三十五里自界首至遼州二百七十五里户主二萬九千三百七十八客一萬三千一百六十七土貢人參一十斤蜜一百斤墨一百枚縣七太平興國二年以武鄉銅鞮二縣𨽻威勝軍熙寧五年省黎城縣入潞城望上黨四鄉上黨一鎮上屯留州西北四十七里二鄉上襄垣州西北八十里三鄉上潞城州東北四十里四鄉中壺關州東二十五里三鄉中長子州西南四十五里四鄉中下涉州東北一百五十八里四鄉古迹長子城毋朱所築黎侯亭在黎侯嶺上黎侯城書云西伯戡黎是也古褫亭漢書志云銅鞮有虒亭下虒敘長平關即白起坑降卒之地壺關羊腸坂見漢書志抱書山出道書福地記三峻山有廟濁漳水出長子西見水經潞水冀州之浸見水經古余古城漢縣也神農廟有神農井神皇得嘉穀之所見城形志唐明皇舊宅潞子廟春秋時潞子嬰兒也豫讓廟關龍逄廟馮亭墓有廟鄉韓上黨太平馮亭也見史記馮奉世廟望晉州平陽郡建雄軍節度治臨汾縣地里東京九百里東至本州界二百七十里自界首至潞州一百一十五里西至本州界一百三十三里自界首至隰州二百五十里南至本州界五十五里自界首至絳州七十里北至本州界一百八十里自界首至汾州一百七十里東南至本州界一百七十里自界首至澤州二百四十里西南至本州界七十三里自界首至絳州六十五里東北至本州界一百四十五里自界首至威勝軍一百七十五里西北至本州界七十五里自界首至隰州一百八十里户主十萬七千四百八十六客四千五百九十八土貢蜜二十斤蠟燭一百條縣九太平興國五年廢沁州以和州縣𨽻州熙寧五年省趙城縣為鎮入洪洞和州為鎮入冀氏元豐二年趙城復為縣望臨汾五鄉樊山一鎮緊洪洞州北七十五里四鄉緊襄陵州西南三十里四鄉上神山州東七十五里二鄉上趙城州北八十五里三鄉中汾西州西北一百六十五里二鄉中霍邑州北一百三十五里三鄉中冀氏州東二百八十里二鄉和川一鎮中下嶽陽州東北九十五里三鄉務二慶厯元年置煉礬州城南礬山州西北七十里古迹女媧氏廟堯廟漢霍將軍祠姑射廟姑射山莊子云堯臨天下見四子藐姑射之山汾水平陽城漢書地里志云平陽堯所都在平水之陽高梁城見春秋師曠廟故楊城春秋時楊國漢楊城縣也趙簡子廟霍山爾雅云西方之美者有霍山多珠玉焉趙城春秋晉獻公滅耿賜趙氏因謂之趙城烏嶺山山海經云烏嶺之山潦水出焉千畝原春秋晉穆公以千畝之戰生子命之曰成師即此地沁水水經云出上黨郡郅都墓中府州永安軍節度治府谷縣地里東京一千七百里東至本州界三十里自界首至火山軍一十里西至本州界六十二里自界首至麟州五十八里南至本州界四十三里自界首至岢嵐軍九十里北至本州界一百二十二里自界首至豐州三里東南至本州界二十五里自界首至火山軍一十五里西南至本州界二十里自界首至嵐州二百八