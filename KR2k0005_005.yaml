body:
  text: 元豐九域志卷五宋王存等撰淮南路東路西路兩浙路淮南路太平興國元年分東西路後併一路熈寧五年復分兩路東路州二十縣三十七大都督府揚州廣陵郡淮南節度治江都縣地里東京一千四百五十里東至本州界八十里自界首至泰州一十八里西至本州界七十里自界首至真州六十里南至江西十五里北至本州界一百五十里自界首至楚州一百四十里東南至本州界四十八里自界首至潤州八里西南至本州界二十五里自界首至真州三十五里東北至本州界八十里自界首至泰州四十五里西北至本州界六十五里自界首至泗州七十五里户主二萬九千七十七客二萬四千八百五十五土貢細苧二十疋青銅鑑二十面莞席一百領縣三𦂳江都二十五鄉揚子板橋大儀灣頭邵伯宜陵𤓰州七鎮望天長州西一百一十里二十八鄉銅城石梁二鎮望高郵州西北一百里一十鄉臨澤三塾北河樊良四鎮古跡仙人搗藥臼見十道圖龍舟堰十道志云魏文帝臨江試龍舟此堰得名邵伯堰按晉書謝安鎮廣陵新城築埭於城北後人思之因名為邵伯埭即此堰也呉公臺大江有江水祠見漢書志䢴溝見左氏傳建隆寺太祖皇帝親征李重進置營於此賊平置寺賜額今正殿御榻存焉景徳三年詔遣使賫太祖御容置於殿内法華院周世宗親征淮南駐驆於此後建為院盤古廟后土廟魏文帝廟文帝幸廣陵城後因立廟貞女廟即孝婦祠也見十道志甘羅廟即謝安石祠也龍興寺損律師和尚碑李華文張從申書李陽冰額時人謂之四絶碑盤古冢隋煬帝陵望亳州譙郡集慶軍節度大中祥符七年升集慶軍節度治譙縣地里東京四百五里東至本州界一百二十四里自界首至宿州一百二十五里西至本州界一百五十里自界首至東京二百五十五里南至本州界七十五里自界首至潁州一百五十里北至本州界四十里自界首至南京八十里東南至本州界三百二十里自界首至壽州四十里西南至本州界一百四十五里自界首至陳州四十里東北至本州界一百五十五里自界首至宿州一百五里西北至本州界八十里自界首至南京六十五里户主八萬六千八百一十一客三萬四千六十八土貢絹二十疋縣七大中祥符七年改真源縣為衞真以宿州臨渙縣𨽻州望譙一千鄉雙溝一鎮望城父州東南七十里七鄉望蒙城州南一百六十里七鄉望衞真州西六十里六鄉望鄼州東八十里七鄉馬頭一鎮望永城州東北一百十五里八鄉𦂳鹿邑州西二百二十里六鄉鄲城一鎮古跡武王封神農後於焦今譙縣是也古羅城城冢記曰譙陵楚平王築今亳州是也鄼縣漢相蕭何所封衛真本苦縣城冢記縣之瀬鄉老君所生之地有舊宅在今太清宫是也有道徳經碑唐明皇書邊韶老子碑薛道衡祠庭碑唐明皇御札碑老君行記碑梅城股伯所封也魏太祖宅太廟是也有大饗碑芒山碭山嵇山嵇康居於山側因而氏之渦水渙水洞霄宫有重修宫碑天祥宫羿廟楚靈王廟楚襄王廟韓安國廟李母墳老君母也梁孝王墳陳勝墳韓安國墳虞詡墳丁儀墳嵇康墳夏侯湛墳上宿州符離郡保靜軍節度建隆元年升防禦開寳五年升保靜軍節度治符離縣地里東京六百三十里東至本州界二百一里自界首至泗州一百九十九里西至本州界一百四里自界首至亳州一百六十六里南至本州界一百六十六里自界首至壽州七十里北至本州界九十里自界首至徐州五十里東南至本州界一百七十九里自界首至濠州九十里西南至本州界一百六十八里自界首至亳州三十四里東北至本州界一百八十里自界首至淮陽軍五十里西北至本州界一百里自界首至徐州一百一十里户主五萬七千八百一十八客四萬八千六十土貢絹一十疋縣四望符離六鄉望蘄州南三十六里三鄉𦂳臨涣州西南九十里三鄉栁子蘄澤二鎮中虹州東一百八十里四鄉古跡古推南即齊置梁曰置州虹縣堯封禹為夏伯邑於此見輿地志省廟今廢汴水西自亳州界東入泗州界淄丘城漢侯邑龍亢城漢縣陽城漢將岑彭侯邑幽鄉在古縣城内漢高帝破黥布於此陔下孝竒曰聚邑名也今有城漢高帝圍項籍之地陳勝廟冢趙王武臣冢有碑獸石柱存焉𦂳楚州山陽郡團練後唐順化軍節度周降防禦皇朝太平興國四年降團練治山陽縣地里東京一千三百里東至海二百八十一里西至本州界三十五里自界首至淮陽軍二百六十里南至本州界一百四十里自界首至揚州一百五十里北至本州界一百六十八里自界首至海州一百四十里東南至本州界一百九十里自界首至泰州一百九十里西南至本州界一百三十五里自界首至泗州四十五里東北至海一百六十五里西北至本州界六十里自界首至淮陽軍二百三十里户主五萬九千七百二十七客二萬二十八土貢紵布一十疋縣五乾徳元年以盱眙縣𨽻泗州開寳九年以泰州鹽城縣𨽻州熈寧五年廢漣水軍以漣水縣𨽻州望山陽五鄉北神一鎮有石鼈山淮水運河望漣水州東北六十里四鄉金城太平二鎮有漣水運河𦂳寶應州南六十里五鄉上游一鎮有運河白水陂上鹽城州東南二百四十里四鄉九鹽場有射陽湖中淮隂州西四十里五鄉十八里河洪澤瀆頭三鎮有淮水鹽瀆沙河古跡淮隂侯廟楚元王廟董永廟公冶長墓漂母墓上海州東海郡團練治胊山縣地里東京一千四百六十里東至海五十二里西至本州界一百五十里自界首至徐州三百三十里南至本州界一百四十里自界首至楚州一百六十里北至本州界一百二十里自界首至宻州一百三十里東南至海一百五十里西南至本州界二百七十里自界首至徐州三百四十里東北至海一十五里西北至本州界一百里自界首至沂州八十里户主二萬六