body:
  text: 元豐九域志地理類二總志之屬提要臣等謹案元豐九域志十卷宋承議郎知制誥丹陽王存等奉敕撰存字敬仲丹陽人登進士第調嘉興主簿歷官尚書右丞事迹具宋史本傳初祥符中李宗諤王曽先後修九域圖至熙寧八年都官員外郎劉師旦以州縣名號多有改易乞奏重修乃命館閣校勘曽肇光祿丞李德芻刪定而以存總其事以舊書名圖而無繪事請改曰志迄元豐三年閏九月書成此本前有存等進書原序稱國朝以來州縣廢置與夫鎮戍城堡之名山澤虞衡之利前書所略則謹志之至于道里廣輪之數昔人罕得其詳今則一州之內首序州封次及旁郡彼此互舉弗相混淆總二十三路京府四次府十州二百四十二軍三十七監四縣一千二百三十五離為十卷王應麟稱其文見于曲阜集蓋曽肇之詞也其書始于四京終于省廢州軍及化外羈縻州凡州縣皆依路分𨽻首具赤畿望緊上中下之名次列地理次列户口次列土貢每縣下又詳載土貢而名山大川之目亦併見焉其于距京距府旁郡交錯四至八到之數縷析最詳深得古人辨方經野之意敘次亦簡潔有法趙與峕賔退録尤稱其土貢一門備載貢物之額數足資考核為諸志之所不及自序所稱文直事核洵無愧其言矣其書最為當世所重民間又有别本刋行內多古迹一門故朝公武讀書後志有新舊九域志之目此為明毛晉影抄宋刻乃元豐間經進原本後藏徐乾學傳是樓中字畫清朗訛闕亦少惟佚其第十卷今以蘇州朱煥家抄本補之仍首尾完具案張淏雲雜雜記稱南渡後閩中刋書不精如睦州宣和中始改嚴州而新刋九域志直改為嚴州今檢此本內睦州之名尚未竄改則其出于北宋刻本可知矣乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀欽定四庫全書元豐九域志卷首宋王存等撰四京皇祐五年以曹陳許鄭滑五州為京畿路至和二年罷東京東京開封府治開封祥符二縣地里東至本京界二百四十五里自界首至南京六十里西至本京界一百一十五里自界首至鄭州二十五里南至本京界二百一十五里自界首至陳州一百五里北至本京界一百里自界首至滑州一百里東南至本京界二百五十五里自界首至亳州一百五十里西南至本京界一百五里自界首至潁昌府七十里東北至本京界一百四十五里自界首至曹州一百三里西北至本京界一百一十五里自界首至衛州七十五里戶主一十八萬三千七百七十客五萬一千八百二十九土貢方紋綾三十匹方紋紗三十匹蘆席一百領麻黃一十五斤酸棗仁一斗縣一十七建隆元年改匡城縣為長垣四年升東明鎮為縣咸平五年升通許鎮為咸平縣大中祥符二年改浚儀縣為祥符熙寧五年廢滑州以白馬韋城胙城三縣𨽻府又廢鄭州以管城新鄭二縣𨽻府仍省原武縣為鎮入陽武滎陽滎澤二縣為鎮入管城元豐四年復置滑州白馬韋城胙城三縣復𨽻滑州八年復置鄭州以管城新鄭二縣原武滎陽滎澤三鎮復為縣並𨽻鄭州赤開封六鄉赤倉一鎮有汴河惠民河通濟渠浚溝逢澤沙海蓼堤吹臺赤祥符八鄉陳橋郭橋八角張二四鎮有夷門山蔡河濟河金水河畿尉氏京南九十里八鄉米曲宋樓盧館三鎮有惠民河長明溝三亭澤陂畿陳留京東五十二里四鄉北南城西城南城東河口蕭館七鎮有皇柏山狼丘汴河睢溝畿雍丘京東八十七里七鄉圉城一鎮有汴河圉城畿封丘京北六十里六鄉潘一鎮有黑山白溝河黃池封丘臺期城畿中牟京西七十里五鄉白沙圃田萬勝三鎮有汴河鄭河圃田澤中牟臺畿陽武京西北九十里一十鄉陽武歸一鎮有黑陽山黃河汴河白溝河畿延津京東南九十里五鄉草市一鎮有土山黃河金堤酸棗臺畿長垣京東北一百五里七鄉有濮水刃河蒲城畿東明京東九十里六鄉故濟陽一鎮有廣濟河東明城畿襄邑京東西一百七十里六鄉缺化黎驛二鎮有汴河睢水畿扶溝京南一百八十里五鄉建雄義聲二鎮有祁耶山洧水白水畿鄢陵京東一百六十里四鄉馬欄橋一鎮有洧水潩水太丘城畿考城京東一百八十里四鄉有蔡丘黃溝畿太康京東南三百三十里八鄉高柴雀橋青銅三鎮有蔡河渦水畿咸平京東南九十里四鄉有牛首城裘亭西京西京河南府河南郡治河南縣地里東京三百八十二里東至本京界二百里自界首至鄭州六十里西至本京界一百八十六里自界首至陜州一百里南至本京界八十二里自界首至汝州七十八里北至本京界六十五里自界首至孟州五十五里東南至本京界一百九十里自界首至潁昌府一百二十里西南至本京界三百二十五里自界首至缺州一百二十五里東北至本京界六十里自界首至孟州二十五里西北至本京界二百三十六里自界首至缺州二百里戶主七萬八千五百五十客三萬七千一百二十五土貢蜜蠟各一百斤缺器二百事縣一十三乾德元年省望陵縣入登封景德四年升永安鎮為永安縣慶厯三年以王缺縣𨽻孟州復以孟州泛水縣缺府省入缺縣為行缺又省壽安潁陽缺氏缺王氏縣為鎮四年復舊熙寧三年省洛陽縣入河南潁陽縣為鎮入登封伊闕縣為鎮入壽安偃師縣為鎮入緱缺氏以王氏縣缺州八年偃師缺省緱氏縣為鎮入焉赤河南四鄉建春門彭婆洛陽龍門上門五鎮有周山萬山缺山北邙山委粟山伊水洛水瀍澗水金水赤永安京東八十五里三鄉孝義一鎮有少室山鳯臺缺山缺河畿偃師京東六十里二鄉緱氏一鎮有首陽山緱氏山半石山景山黃河曲洛畿鞏京東一百一十里一鄉有侯山九山黃河洛口畿登封京東南一百三十里二鄉潁陽曲河費莊三鎮有嵩山太室山箕山陽城山潁泉畿密京東南二百里一鄉大隗一鎮有方山大隗山陘山洧水潩水鄶水畿